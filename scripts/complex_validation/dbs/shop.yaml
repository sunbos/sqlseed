db_path: /workspace/scripts/complex_validation/dbs/shop_yaml.db
seed: 42
tables:
  - name: users
    count: 50
    columns:
      - name: email
        generator: email
      - name: region_code
        generator: choice
        params:
          choices: ["CN-East", "CN-North", "CN-South", "EU-West", "US-East"]
  - name: products
    count: 30
    columns:
      - name: name
        generator: word
      - name: price
        generator: float
        params:
          min_value: 1.0
          max_value: 500.0
  - name: orders
    count: 100
  - name: order_items
    count: 200
    columns:
      - name: quantity
        generator: integer
        params:
          min_value: 1
          max_value: 5
      - name: unit_price
        generator: float
        params:
          min_value: 1.0
          max_value: 500.0
      - name: line_total
        derive_from: [quantity, unit_price]
        expression: "round(row['quantity'] * row['unit_price'], 2)"
associations:
  - column_name: region_code
    source_table: users
    target_tables: [products]
