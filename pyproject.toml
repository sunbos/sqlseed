[build-system]
requires = ["hatchling", "hatch-vcs"]
build-backend = "hatchling.build"

[project]
name = "sqlseed"
dynamic = ["version"]
requires-python = ">=3.10"
description = "Declarative multi-database (SQLite/PostgreSQL) test data generation toolkit"
readme = "README.md"
license = "AGPL-3.0-or-later"
authors = [
    {name = "SunBo", email = "1443584939@qq.com"},
]
keywords = ["sqlite", "data-generation", "testing", "database", "seed"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: GNU Affero General Public License v3 or later (AGPLv3+)",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Database",
    "Topic :: Software Development :: Testing",
]

dependencies = [
    "pydantic>=2.0",
    "pluggy>=1.3",
    "structlog>=24.0",
    "pyyaml>=6.0",
    "typing_extensions>=4.4",
    "simpleeval>=1.0",
    "rstr>=3.2",
    "sqlalchemy>=2.0",
    "faker>=30.0",
    # sqlglot: pure-Python SQL parser (zero transitive deps), used by
    # core/check_parser to deterministically parse CHECK constraints via AST
    # instead of regex. Parses any SQL; we only extract single-column literal
    # bounds/enums/lengths and explicitly decline cross-column/OR/references.
    "sqlglot>=25.0",
]

[project.urls]
Homepage = "https://github.com/sunbos/sqlseed"
Documentation = "https://github.com/sunbos/sqlseed#readme"
Repository = "https://github.com/sunbos/sqlseed"
Issues = "https://github.com/sunbos/sqlseed/issues"

[project.optional-dependencies]
mimesis = ["mimesis>=18.0"]
notebook = ["tqdm>=4.66"]
postgres = ["psycopg[binary]>=3.0"]
# Per ARCHITECTURE.md Section 3.2: the `sqlseed` console command lives in
# the standalone `sqlseed-cli` package. Users who want the CLI install
# with: pip install sqlseed-cli  (which auto-pulls sqlseed core).
# `pip install "sqlseed[cli]"` is a convenience alias that pulls
# sqlseed-cli into the current install.
cli = ["sqlseed-cli>=0.1.0"]
all = ["mimesis>=18.0", "tqdm>=4.66", "psycopg[binary]>=3.0", "testcontainers>=4.0", "sqlseed-cli>=0.1.0"]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "pytest-asyncio>=0.24",
    "pytest-benchmark>=4.0",
    "ruff>=0.5",
    "mypy>=1.10",
    "pre-commit>=3.0",
    "tqdm>=4.66",
    "testcontainers>=4.0",
    "psycopg[binary]>=3.0",
    "import-linter>=2.0",
    "mutmut>=2.5,<3",
    "sqlseed-cli>=0.1.0",
]
docs = [
    "mkdocs-material>=9.0",
    "mkdocstrings[python]>=0.25",
]

# Per ARCHITECTURE.md Section 7.1: the `sqlseed` console command is
# provided by the standalone `sqlseed-cli` package, NOT by core sqlseed.
# Core sqlseed has no `[project.scripts]` entry point — installing
# `pip install sqlseed` alone provides only the Python API.
# Install `pip install sqlseed-cli` to get the `sqlseed` command.

[project.entry-points."sqlseed"]
faker = "sqlseed.generators.faker_provider:FakerProvider"
mimesis = "sqlseed.generators.mimesis_provider:MimesisProvider"

[tool.hatch.version]
source = "vcs"
fallback-version = "0.0.0"

[tool.hatch.build.targets.wheel]
packages = ["src/sqlseed"]

[tool.hatch.build.targets.sdist]
exclude = [
    "docs/",
    "tests/",
    "plugins/sqlseed-ai/",
    "plugins/sqlseed-cli/",
    "plugins/mcp-server-sqlseed/",
    ".github/",
    ".trae/",
    ".gemini/",
    "*.db",
    "AGENTS.md",
    "CLAUDE.md",
    "GEMINI.md",
]

[tool.ruff]
target-version = "py310"
line-length = 120
extend-exclude = ["examples/notebooks"]

[tool.ruff.lint.isort]
known-first-party = ["sqlseed"]
# Plugins are classified as third-party from the core's perspective.
# mcp_server_sqlseed is added here so ruff places its import BEFORE
# sqlseed (first-party), matching pylint's wrong-import-order expectation.
# Without this, ruff treats mcp_server_sqlseed as local-folder (because it
# is in the same package directory as the linted file) and places it AFTER
# sqlseed, conflicting with pylint. See server.py import block for the
# concrete pattern. sqlseed_ai and sqlseed_cli are already third-party.
known-third-party = ["sqlseed_ai", "sqlseed_cli", "mcp_server_sqlseed"]

[tool.ruff.lint]
# D100-D107: pydocstyle missing-docstring rules. Enabled to safeguard source
# code docstring coverage (pylint's missing-*-docstring is globally disabled
# below because test code legitimately omits docstrings). D107/D105 are
# ignored: __init__ and dunder methods inherit documentation from the class
# docstring per pydocstyle convention. See per-file-ignores below for test
# directories which are exempt from D rules entirely.
select = ["E", "W", "F", "I", "N", "UP", "B", "A", "SIM", "TCH", "RET", "PLW", "PLC", "PLR", "RUF",
          "D100", "D101", "D102", "D103", "D104", "D106"]
ignore = [
    "PLR1730", "PLR2004", "PLR0913", "PLR0911",
    "RUF002", "RUF003", "PLR0912", "PLR0915",
    # PLR0917 (too-many-positional-arguments): same rationale as PLR0913
    # above — MCP tools, orchestrator, hookspecs, and test fixtures
    # intentionally expose multiple positional parameters by API design.
    "PLR0917",
    # ---- Project convention: lazy import of optional deps ----
    # CLAUDE.md: "Optional deps (mimesis): always lazy import with try/except"
    # Optional dependencies (mimesis, faker, rich, tqdm, testcontainers, etc.)
    # MUST be imported lazily inside try/except blocks or factory functions
    # so the core package stays importable when the optional dep is absent.
    # This pattern is fundamental to the 4-package architecture (core has no
    # CLI/AI/MCP code; rich/tqdm belong to sqlseed-cli, not core). Inline
    # `# noqa: PLC0415` would be problem-avoidance; project-level disable
    # with documentation is the correct approach. Mirrors pylint's
    # `import-outside-toplevel` disable in [tool.pylint.main] above.
    "PLC0415",
    # ---- Docstring conventions (pydocstyle) ----
    # D105: magic methods (__init__, __repr__, etc.) inherit documentation
    # from the class docstring; requiring a separate docstring is noise.
    # D107: __init__ specifically — same rationale as D105. The class
    # docstring documents constructor parameters by convention.
    "D105", "D107",
]
allowed-confusables = ["：", "（", "）", "，", "。"]

[tool.ruff.lint.per-file-ignores]
# Test code is exempt from docstring (D) rules: test functions use `test_`
# prefixes for self-documentation (Python community convention), test
# classes use `Test` prefixes, and test modules use `test_` filenames.
# Production source code (src/, plugins/*/src/) is NOT exempt — D rules
# remain active there to prevent docstring drift. This is the ruff
# equivalent of pylint's disabled missing-*-docstring rules below.
"tests/**/*.py" = ["D"]
"plugins/*/tests/**/*.py" = ["D"]


# ---------------------------------------------------------------------------
# pylint: CodeFlow runs pylint separately from ruff (the CI lint gate).
# This config eliminates false positives that conflict with documented project
# conventions. In pylint 3.x/4.x, `disable` must be under [tool.pylint.main]
# (NOT [tool.pylint."messages control"] which is the legacy INI-era format).
# `known-first-party` and `known-third-party` ARE pylint options (under
# [tool.pylint.imports]), mirroring the isort/ruff settings above.
# Note: pylint 4.x does NOT read tests/.pylintrc (it only reads pyproject.toml
# from the repo root). Test-specific rule disables are therefore documented
# inline in the `disable` list below. Source code docstring coverage is
# independently safeguarded by ruff D100-D104,D106 rules (see
# [tool.ruff.lint] above) via [tool.ruff.lint.per-file-ignores].
# ---------------------------------------------------------------------------
[tool.pylint.main]
# Pyproject-based pylint config (complements ruff).
max-line-length = 120  # Match ruff line-length (project convention).

# Windows API ctypes Structure fields use Hungarian notation (e.g. dwLength,
# ullTotalPhys) that MUST match the Win32 C struct definition for binary
# compatibility. The standard snake_case attr-rgx would flag these as
# invalid-name (C0103). This regex whitelists the Hungarian-notation prefixes
# used in sqlseed_ai/_hardware.py: dw (DWORD), ull (ULONGLONG), cb (count of
# bytes), lp (long pointer), h (handle), sz (string). Without this, the ctypes
# binding to GlobalMemoryStatusEx would be impossible to lint cleanly.
# Reference: Win32 API naming conventions (Microsoft Win32 documentation).
good-names-rgxs = "^(dw|ull|cb|lp|h|sz|p|l|w|b|n)[A-Z][a-zA-Z0-9]*$"

disable = [
    # ---- Project convention: lazy import of optional deps ----
    # CLAUDE.md: "Optional deps (mimesis): always lazy import with try/except"
    # Used for: testcontainers, sqlalchemy submodules, mimesis, tqdm, etc.
    "import-outside-toplevel",

    # ---- Architectural pattern: TYPE_CHECKING stubs in mixin classes ----
    # core/orchestrator/ mixins and sqlseed-ai/analyzer/ mixins use
    # TYPE_CHECKING blocks to declare stub methods provided by other mixins.
    # Stubs use `raise NotImplementedError` (not `...`) so pylint does not
    # infer an implicit `return None` and falsely flag callers with
    # assignment-from-no-return. Parameter names must match real method
    # signatures for type checkers and IDE documentation.
    "unnecessary-ellipsis",
    "unused-argument",
    # Stubs return `...` (None), so pylint reports "assignment-from-no-return"
    # when callers assign the result. The real implementations live in other
    # mixins and DO return values; pylint cannot see them through the mixin
    # composition. This is the same false-positive pattern as above.
    "assignment-from-no-return",
    # Stubs use `raise NotImplementedError`, which pylint treats as an
    # abstract method. When a class (e.g. SchemaAnalyzer, DataOrchestrator)
    # composes multiple mixins via multiple inheritance, pylint cannot
    # recognize that sibling mixins provide the real implementations, and
    # reports abstract-method on the composed class. This is a known pylint
    # limitation with the mixin composition pattern (see Python typing
    # mixin pattern). The real implementations are present at runtime.
    "abstract-method",

    # ---- duplicate-code (R0801): noisy heuristic for architectural patterns ----
    # The remaining duplicate-code reports are false positives from:
    # 1. TYPE_CHECKING stub blocks duplicated across orchestrator/analyzer mixins
    #    (each mixin must declare stubs for methods it calls from other mixins)
    # 2. pluggy hookimpl signatures matching hookspec signatures (framework req)
    # 3. Test code with similar test functions (inherent to readable test code)
    # Real code duplications have been refactored (FillOptions dataclass,
    # _handle_llm_api_exception shared helper). R0801 is disabled in many
    # large Python projects (Django, Flask) for being too noisy.
    "duplicate-code",

    # ---- Click command pattern ----
    # Click @click.option decorators inherently add parameters to the
    # command function. 14 params is normal for a CLI with many flags.
    "too-many-arguments",

    # ---- Monorepo package classification ----
    # The repo ships 4 independent packages (sqlseed core + 3 plugins).
    # pylint runs from the repo root with a single [tool.pylint.main] config
    # and cannot apply per-package first-party classification. When linting
    # a plugin file (e.g. mcp_server_sqlseed/server.py), pylint treats the
    # plugin's own package as third-party and sqlseed (a dependency from the
    # plugin's perspective) as first-party, producing false wrong-import-order
    # warnings. The actual import order in plugin files already follows PEP 8
    # (third-party deps before the local package). ruff handles this correctly
    # via per-plugin pyproject.toml configs.
    "wrong-import-order",

    # ---- Test code conventions ----
    # Mock functions must match real signatures (for patch.object) but
    # don't use all params. Conftest re-exports fixtures by design.
    "unused-import",
    # Phase F architecture: plugin tests/*/conftest.py re-export fixtures
    # from root tests/conftest.py via ``from tests.conftest import ...``.
    # pytest requires this exact import form to share session-scoped
    # fixtures (pg_url, available_llm_backend) across packages. pylint
    # flags it as import-self because the conftest modules share the
    # ``tests.conftest`` qualified name through sys.path manipulation;
    # the re-export is intentional and documented in ARCHITECTURE.md.
    "import-self",

    # ---- Heuristic warnings that conflict with documented design ----
    # These are pylint's opinionated thresholds, not real code issues.
    # The project's design (per ARCHITECTURE.md) intentionally exceeds them.

    # MCP tools (mcp.py) expose multiple parameters by API design (db_path,
    # url, table, count, etc.). Cannot be reduced without breaking the contract.
    "too-many-positional-arguments",

    # Orchestrator functions (__init__.py fill/preview, sqlalchemy_adapter)
    # have many locals because they coordinate multiple steps. Splitting would
    # harm readability without reducing real complexity.
    "too-many-locals",

    # Adapter classes (SQLAlchemyBatchInserter) implement a Protocol with a
    # single public method. Adding methods just to satisfy pylint would be
    # over-engineering. Protocol defines the public surface, not pylint.
    "too-few-public-methods",

    # Database adapters manage multiple resources (engine, connection, schema
    # cache, normalizer, etc.). 8 attributes is normal for a stateful adapter.
    "too-many-instance-attributes",

    # ---- Test code conventions (project-level disable, documented) ----
    # pylint 4.x has no native per-file-ignores (unlike ruff). The
    # tests/.pylintrc file is NOT read by pylint 4.x (it only reads
    # pyproject.toml from the repo root). These rules fire on every test
    # module and conflict with documented Python testing conventions. They
    # are globally disabled here with documentation; source code docstring
    # coverage is independently safeguarded by ruff D100-D104,D106 rules
    # (see [tool.ruff.lint] select above) which only apply to src/ and
    # plugins/*/src/ (tests are exempt via [tool.ruff.lint.per-file-ignores]).

    # Test functions use `test_` prefixes for self-documentation (Python
    # community convention). Adding docstrings to 973 test functions would
    # be redundant noise. Source code docstrings are checked by ruff D103.
    "missing-function-docstring",
    # Test classes use `Test` prefixes for self-documentation. Source code
    # class docstrings are checked by ruff D101.
    "missing-class-docstring",
    # Test modules use `test_` filenames for self-documentation. Source code
    # module docstrings are checked by ruff D100.
    "missing-module-docstring",
    # Tests deliberately access private members (``_config``,
    # ``_parse_json_response``, ``_build_context``) to verify internal
    # behavior. Refactoring to public APIs would defeat the test's purpose.
    "protected-access",
    # Test classes use setUp/fixture methods that assign attributes outside
    # __init__ (e.g. self.mapper in setUp). This is the standard pytest
    # pattern.
    "attribute-defined-outside-init",
    # Test classes group all tests for a module in one class (e.g.
    # TestColumnMapper has 22 test methods). Splitting would harm test
    # discoverability.
    "too-many-public-methods",
    # Test constants like _AI_PLUGIN_AVAILABLE use UPPER_CASE with leading
    # underscore (private module constant). pylint's default snake_case rule
    # for variables flags this; the naming is intentional.
    "invalid-name",
    # Test modules are necessarily long when covering many code paths (e.g.
    # test_cli_ai_commands.py has 1283 lines for 90 tests).
    "too-many-lines",

    # ---- pylint 4.x false positives (mypy covers these correctly) ----
    # pylint 4.x cannot resolve callability of values typed via Callable type
    # aliases (e.g. RowTransformFn). This is a known pylint limitation; mypy
    # correctly infers callability. See test_core/test_transform.py.
    "not-callable",
    # Some tests deliberately pass invalid keyword arguments to verify
    # TypeError error paths (e.g. test_fill_with_url_does_not_accept_snapshot
    # passes ``snapshot=True`` to sqlseed.fill which has no such parameter).
    # mypy covers real unexpected-keyword-arg errors in source code.
    "unexpected-keyword-arg",
    # Some tests deliberately omit required arguments to verify ValueError
    # error paths (e.g. test_fill_no_target_raises calls sqlseed.fill()
    # without db_path/url). mypy covers real no-value-for-parameter errors.
    "no-value-for-parameter",
    # Pydantic v2 injects ``model_fields`` and other ClassVars via metaclass
    # at class creation. pylint cannot see these attributes and reports
    # no-member (e.g. MCPServerConfig.model_fields in test_config.py). This
    # is a known pylint limitation with Pydantic v2.
    "no-member",
]


[tool.mypy]
strict = true
python_version = "3.10"
files = ["src", "plugins"]
# Exclude test directories: per CLAUDE.md, mypy is strict on src/ and plugins/
# source code, relaxed on tests/. Multiple plugins/*/tests/__init__.py files
# would otherwise collide as duplicate "tests" modules.
exclude = ["tests/", "plugins/.*/tests/"]

[[tool.mypy.overrides]]
module = ["mimesis.*", "faker.*", "yaml", "simpleeval", "sqlglot", "sqlglot.*", "sqlseed_ai.*", "sqlseed_cli.*", "mcp.*", "mcp_server_sqlseed.*", "tqdm", "tqdm.*", "rich.*", "click.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = [
    "sqlseed.generators.mimesis_provider",
    "sqlseed.generators.faker_provider",
]
disable_error_code = ["no-any-return"]

[[tool.mypy.overrides]]
module = "tests.*"
disallow_untyped_defs = false
disallow_incomplete_defs = false
disallow_untyped_calls = false
check_untyped_defs = true

[tool.pytest.ini_options]
testpaths = ["tests", "plugins/mcp-server-sqlseed/tests", "plugins/sqlseed-cli/tests", "plugins/sqlseed-ai/tests"]
addopts = "-ra --strict-markers"
markers = [
    "integration: marks tests as integration tests (require external services like Docker/PostgreSQL)",
]
consider_namespace_packages = true

# ---------------------------------------------------------------------------
# import-linter: architectural layer enforcement (CI gate)
# Encodes the "Never" rules from CLAUDE.md so violations fail CI automatically
# instead of relying on AI agents reading the docs.
# Run: lint-imports
# ---------------------------------------------------------------------------
[tool.importlinter]
root_packages = ["sqlseed"]

# Rule 1: generators must not depend on core (CLAUDE.md: "Never: generators → core")
[[tool.importlinter.contracts]]
name = "Generators must not depend on core"
type = "forbidden"
source_modules = ["sqlseed.generators"]
forbidden_modules = ["sqlseed.core"]

# Rule 2: database must not depend on core (CLAUDE.md: "Never: database → core")
[[tool.importlinter.contracts]]
name = "Database must not depend on core"
type = "forbidden"
source_modules = ["sqlseed.database"]
forbidden_modules = ["sqlseed.core"]

# Rule 3: _utils must not depend on any upper layer (CLAUDE.md: "_utils → no internal deps")
[[tool.importlinter.contracts]]
name = "Utils must not depend on upper layers"
type = "forbidden"
source_modules = ["sqlseed._utils"]
forbidden_modules = [
    "sqlseed.core",
    "sqlseed.generators",
    "sqlseed.database",
    "sqlseed.plugins",
    "sqlseed.config",
]

# ---------------------------------------------------------------------------
# mutmut: mutation testing to detect self-proving mock-based tests.
# Mock-heavy tests can pass because the mock returns what the test author
# expected, not because the production code actually computes the right thing.
# mutmut injects small faults (e.g. `==` -> `!=`, `50` -> `51`) into production
# code and re-runs tests — surviving mutants indicate tests that fail to catch
# real behavior changes (i.e. self-proving tests).
#
# Baseline (2026-06-25) for src/sqlseed/core/unique_adjuster.py:
#   - 122 mutants generated, 62 killed (50.8%), 60 survived (49.2%)
#   - Hot zones: _adjust_string (lines 74-103), _adjust_integer (lines 125-143)
#   - Root cause: tests mock ColumnMapper.map_column and assert on the call
#     rather than on the computed GeneratorSpec.params values.
#
# Run on Windows:  set PYTHONUTF8=1 && set PYTHONIOENCODING=utf-8 && python -m mutmut run
# Run on Linux/CI: PYTHONUTF8=1 python -m mutmut run
# Inspect:         python -m mutmut results
# Diff a survivor:  python -m mutmut show <mutant_id>
# Apply + retest:   python -m mutmut apply <mutant_id> && pytest <test_file>
# ---------------------------------------------------------------------------
[tool.mutmut]
# Default target: the highest-risk module from the 2026-06-25 baseline.
# Override on the CLI with --paths-to-mutate and --runner, e.g.
#   python -m mutmut run --paths-to-mutate "src/sqlseed/core/stream.py" \
#     --runner "python -m pytest tests/test_core/test_stream.py -x -q"
paths_to_mutate = ["src/sqlseed/core/unique_adjuster.py"]
runner = "python -m pytest tests/test_core/test_unique_adjuster.py -x -q --no-header"
