repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-toml
      - id: check-merge-conflict
      - id: check-added-large-files

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.6.9
    hooks:
      - id: ruff
        args: [--fix]
      - id: ruff-format

  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v1.11.2
    hooks:
      - id: mypy
        files: ^(src/sqlseed/|plugins/)
        args: [--config-file=pyproject.toml]
        additional_dependencies:
          - pydantic>=2.0
          - pluggy>=1.3
          - structlog>=24.0
          - pyyaml>=6.0
          - click>=8.0
          - rich>=13.0
          - typing_extensions>=4.4
          - simpleeval>=1.0
          - rstr>=3.2
          - sqlalchemy>=2.0
          - faker>=30.0
          - openai>=1.0
          - httpx>=0.24.0
          - mcp>=1.0

  - repo: local
    hooks:
      - id: sync-docs
        name: Sync documentation facts
        entry: python scripts/sync_docs.py --check
        language: system
        files: \.(py|md)$
        pass_filenames: false
        stages: [pre-commit]
      - id: ctxlint
        name: Lint context files (AGENTS.md, CLAUDE.md)
        entry: npx @yawlabs/ctxlint .
        language: system
        files: ^(AGENTS\.md|CLAUDE\.md|GEMINI\.md|.*AGENTS\.md)$
        pass_filenames: false
        stages: [pre-commit]
