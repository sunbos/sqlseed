# Automatic Analysis reads this file from the default branch.
# Keep production, examples, scripts, and CI in scope; classify pytest/Node tests
# separately. Test inclusions also remove these paths from the source scope.
sonar.sources=.
sonar.tests=conftest.py,tests,plugins/mcp-server-sqlseed/tests,plugins/sqlseed-ai/tests,plugins/sqlseed-cli/tests,plugins/sqlseed-web/tests
sonar.test.inclusions=conftest.py,tests/**/*,plugins/mcp-server-sqlseed/tests/**/*,plugins/sqlseed-ai/tests/**/*,plugins/sqlseed-cli/tests/**/*,plugins/sqlseed-web/tests/**/*
