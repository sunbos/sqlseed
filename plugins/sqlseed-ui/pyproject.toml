[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "sqlseed-ui"
version = "0.1.0"
description = "Web UI for sqlseed: schema browsing, column-mapping inspector, config editor, preview/fill runner, and self-heal laboratory."
requires-python = ">=3.10"
license = "AGPL-3.0-or-later"
authors = [{ name = "sqlseed contributors" }]
keywords = ["sqlseed", "test-data", "web-ui", "fastapi"]
dependencies = [
    "sqlseed",
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
ai = ["sqlseed-ai"]
dev = ["pytest>=8.0", "httpx>=0.27"]

[project.scripts]
sqlseed-ui = "sqlseed_ui.app:main"

[tool.hatch.build.targets.wheel]
packages = ["src/sqlseed_ui"]

[tool.ruff]
line-length = 120

[tool.mypy]
strict = true
