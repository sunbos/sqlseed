[build-system]
requires = ["hatchling", "hatch-vcs"]
build-backend = "hatchling.build"

[project]
name = "sqlseed-ai"
dynamic = ["version"]
requires-python = ">=3.10"
description = "AI-powered data generation plugin for sqlseed"
readme = "README.md"
license = "AGPL-3.0-or-later"
authors = [
    {name = "SunBo", email = "1443584939@qq.com"},
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "License :: OSI Approved :: GNU Affero General Public License v3 or later (AGPLv3+)",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]
dependencies = [
    "sqlseed>=0.1.0",
    "sqlseed-cli>=0.1.0",
    "openai>=1.0",
    "httpx>=0.24.0",
    "networkx>=3.0",
]

[project.urls]
Homepage = "https://github.com/sunbos/sqlseed"
Repository = "https://github.com/sunbos/sqlseed/tree/main/plugins/sqlseed-ai"

[project.optional-dependencies]
mcp = ["mcp>=1.0,<2"]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
    "pytest-asyncio>=0.21",
    "hypothesis>=6.100",
]

[project.scripts]
mcp-server-sqlseed-ai = "sqlseed_ai.mcp:main"

# Plugin registration: ai subcommand on the sqlseed core plugin hook.
[project.entry-points."sqlseed"]
ai = "sqlseed_ai:plugin"

# CLI subcommand registration: sqlseed_cli iterates this group at startup
# and calls each entry's ``register(cli_group)`` callable to attach
# subcommands. This decouples sqlseed-cli from importing sqlseed-ai.
[project.entry-points."sqlseed.cli_commands"]
ai_suggest = "sqlseed_ai.cli.ai_commands:register"

[tool.hatch.version]
source = "vcs"
fallback-version = "0.0.0"

[tool.hatch.version.raw-options]
root = "../.."

[tool.hatch.build.targets.wheel]
packages = ["src/sqlseed_ai"]

[tool.hatch.build.targets.sdist]
exclude = [
    "AGENTS.md",
    "uv.lock",
]
