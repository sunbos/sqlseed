# Wait for Linux, Windows, native ARM64 macOS and native Intel macOS reports.
codecov:
  notify:
    after_n_builds: 4
    wait_for_ci: true

coverage:
  status:
    project:
      default:
        # Keep any organization-level target; never allow coverage to fall below it.
        threshold: 0
        if_not_found: failure
        informational: false
    patch:
      default:
        threshold: 0
        if_not_found: failure
        informational: false
