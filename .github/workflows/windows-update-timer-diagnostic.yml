# Approved limited diagnostic; not full Windows acceptance.
# Temporary workflow for the isolated diagnostic branch only.
# Never open a PR or push this commit to main/fix/feat/refactor to run it.
name: Windows update timer diagnostic (scoped)

'on':
  push:
    branches:
      - codex/windows-update-timer-diagnostic-20261111

permissions:
  contents: read

env:
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  PIP_NO_WARN_SCRIPT_LOCATION: "0"
  PYTHONUNBUFFERED: "1"
  PYTHONDONTWRITEBYTECODE: "1"

jobs:
  windows-update-timer-diagnostic:
    # Deliberately distinct from required test-compat (windows-latest).
    name: Windows update timer diagnostic (3 selected cases)
    if: github.repository == 'sunbos/sqlseed' && github.event_name == 'push' && github.ref == 'refs/heads/codex/windows-update-timer-diagnostic-20261111'
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - name: Check out the exact diagnostic commit
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5, existing repository pin
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Install the existing hash-locked CI environment
        uses: ./.github/actions/setup-env
        with:
          python-version: "3.12"

      - name: Run exactly three update timer regressions
        shell: pwsh
        timeout-minutes: 2
        run: |
          python -B -m pytest -p no:cacheprovider -vv --tb=short `
            -W error::ResourceWarning `
            -W error::pytest.PytestUnraisableExceptionWarning `
            'plugins/sqlseed-web/tests/test_settings_update_lifecycle.py::test_stalled_network_returns_before_release_and_late_reads_cannot_publish_cache[headers]' `
            'plugins/sqlseed-web/tests/test_settings_update_clock_boundary.py::test_owner_timeout_is_discarded_even_when_clock_has_not_advanced' `
            'plugins/sqlseed-web/tests/test_settings_update_lifecycle.py::test_earlier_observer_deadline_does_not_discard_a_newer_shared_check'
          exit $LASTEXITCODE
