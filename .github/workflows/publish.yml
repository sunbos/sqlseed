name: Publish to PyPI

on:
  release:
    types: [published]
  workflow_dispatch:

jobs:
  # ── Pre-publish smoke test ───────────────────────────────────
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd  # v5
        with:
          fetch-depth: 0

      - uses: ./.github/actions/setup-env
        with:
          python-version: ${{ matrix.python-version }}

      - name: Run tests
        run: pytest --tb=short -q

  # ── Build all distributions ──────────────────────────────────
  build:
    runs-on: ubuntu-latest
    needs: [test]
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd  # v5
        with:
          fetch-depth: 0

      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405  # v6
        with:
          python-version: "3.x"

      - name: Install build dependencies
        run: pip install build twine

      - name: Require a version tag
        run: |
          case "$GITHUB_REF" in
            refs/tags/v*) ;;
            *) echo "Select a v-prefixed release tag; development branches cannot be published to PyPI."; exit 1 ;;
          esac

      - name: Build sqlseed
        run: python -m build --outdir dist/

      - name: Build sqlseed-ai
        run: python -m build --outdir ../../dist/
        working-directory: plugins/sqlseed-ai

      - name: Build sqlseed-cli
        run: python -m build --outdir ../../dist/
        working-directory: plugins/sqlseed-cli

      - name: Build mcp-server-sqlseed
        run: python -m build --outdir ../../dist/
        working-directory: plugins/mcp-server-sqlseed

      - name: Build sqlseed-web
        run: python -m build --outdir ../../dist/
        working-directory: plugins/sqlseed-web

      - name: Validate package metadata
        run: twine check --strict dist/*

      - name: Verify every wheel matches the release tag
        run: |
          python - <<'PY'
          import os
          from pathlib import Path
          from packaging.utils import parse_wheel_filename
          from packaging.version import Version
          expected = Version(os.environ["GITHUB_REF_NAME"].removeprefix("v"))
          wheels = list(Path("dist").glob("*.whl"))
          if expected.local is not None or len(wheels) != 5:
              raise SystemExit("A release requires exactly five wheels and a public version.")
          for wheel in wheels:
              _, actual, _, _ = parse_wheel_filename(wheel.name)
              if actual != expected:
                  raise SystemExit(f"{wheel.name} does not match release {expected}")
          PY

      - name: List distributions
        run: ls -la dist/

      - name: Upload distributions
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7
        with:
          name: release-dists
          path: dist/

  # ── Publish to PyPI (Trusted Publisher) ──────────────────────
  publish:
    runs-on: ubuntu-latest
    needs: [build]
    permissions:
      id-token: write
      attestations: write

    environment:
      name: pypi
      url: https://pypi.org/project/sqlseed/

    steps:
      - name: Retrieve release distributions
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131  # v7
        with:
          name: release-dists
          path: dist/

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@cef221092ed1bacb1cc03d23a2d87d1d172e277b  # v1.14.0
        with:
          packages-dir: dist/
          skip-existing: true
          attestations: true
