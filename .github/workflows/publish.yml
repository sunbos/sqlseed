name: Publish to PyPI

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing v-prefixed tag to publish using this workflow revision
        required: true
        type: string

permissions:
  contents: read

jobs:
  resolve-release:
    name: Resolve the release source
    runs-on: ubuntu-latest
    outputs:
      commit: ${{ steps.release.outputs.commit }}
      version: ${{ steps.release.outputs.version }}
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Require an existing version tag
        id: release
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name || inputs.release_tag }}
        run: |
          case "$RELEASE_TAG" in
            v[0-9]*) ;;
            *) echo "Select an existing v-prefixed release tag."; exit 1 ;;
          esac
          git check-ref-format "refs/tags/$RELEASE_TAG"
          release_commit="$(git rev-parse --verify "refs/tags/${RELEASE_TAG}^{commit}")"
          printf 'commit=%s\nversion=%s\n' "$release_commit" "${RELEASE_TAG#v}" >> "$GITHUB_OUTPUT"
          printf 'Release tag: %s\nSource commit: %s\n' "$RELEASE_TAG" "$release_commit" >> "$GITHUB_STEP_SUMMARY"

  # ── Pre-publish smoke test ───────────────────────────────────
  test:
    runs-on: ubuntu-latest
    needs: [resolve-release]
    strategy:
      matrix:
        python-version: ["3.10", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd  # v5
        with:
          fetch-depth: 0
          ref: ${{ needs.resolve-release.outputs.commit }}

      - uses: ./.github/actions/setup-env
        with:
          python-version: ${{ matrix.python-version }}

      - name: Run tests
        run: pytest --tb=short -q

  # ── Build all distributions ──────────────────────────────────
  build:
    runs-on: ubuntu-latest
    needs: [resolve-release, test]
    env:
      RELEASE_VERSION: ${{ needs.resolve-release.outputs.version }}
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd  # v5
        with:
          fetch-depth: 0
          ref: ${{ needs.resolve-release.outputs.commit }}

      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405  # v6
        with:
          python-version: "3.x"

      - uses: ./.github/actions/install-ci-deps

      - name: Build sqlseed
        run: python -m build --no-isolation --outdir dist/

      - name: Build sqlseed-ai
        run: python -m build --no-isolation --outdir ../../dist/
        working-directory: plugins/sqlseed-ai

      - name: Build sqlseed-cli
        run: python -m build --no-isolation --outdir ../../dist/
        working-directory: plugins/sqlseed-cli

      - name: Build mcp-server-sqlseed
        run: python -m build --no-isolation --outdir ../../dist/
        working-directory: plugins/mcp-server-sqlseed

      - name: Build sqlseed-web
        run: python -m build --no-isolation --outdir ../../dist/
        working-directory: plugins/sqlseed-web

      - name: Validate package metadata
        run: twine check --strict dist/*

      - name: Verify every wheel matches the release tag
        run: |
          python - <<'PY'
          import os
          from pathlib import Path
          from packaging.utils import parse_wheel_filename
          from packaging.version import Version
          expected = Version(os.environ["RELEASE_VERSION"])
          wheels = list(Path("dist").glob("*.whl"))
          if expected.local is not None or len(wheels) != 5:
              raise SystemExit("A release requires exactly five wheels and a public version.")
          for wheel in wheels:
              _, actual, _, _ = parse_wheel_filename(wheel.name)
              if actual != expected:
                  raise SystemExit(f"{wheel.name} does not match release {expected}")
          PY

      - name: List distributions
        run: ls -la dist/

      - name: Upload distributions
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7
        with:
          name: release-dists
          path: dist/

  # ── Publish to PyPI (Trusted Publisher) ──────────────────────
  publish:
    name: Publish ${{ matrix.package }}
    runs-on: ubuntu-latest
    needs: [resolve-release, build]
    env:
      RELEASE_VERSION: ${{ needs.resolve-release.outputs.version }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - package: sqlseed
            environment: pypi
          - package: sqlseed-ai
            environment: pypi
          - package: mcp-server-sqlseed
            environment: pypi
          - package: sqlseed-cli
            environment: pypi-cli
          - package: sqlseed-web
            environment: pypi-web
    permissions:
      id-token: write
      attestations: write

    environment:
      name: ${{ matrix.environment }}
      url: https://pypi.org/project/${{ matrix.package }}/

    steps:
      - name: Retrieve release distributions
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131  # v7
        with:
          name: release-dists
          path: dist/

      - name: Select this project's wheel and sdist
        env:
          RELEASE_PACKAGE: ${{ matrix.package }}
        run: |
          python - <<'PYTHON'
          import os
          import shutil
          from pathlib import Path

          package = os.environ["RELEASE_PACKAGE"].replace("-", "_")
          version = os.environ["RELEASE_VERSION"]
          source = Path("dist")
          files = [source / f"{package}-{version}-py3-none-any.whl", source / f"{package}-{version}.tar.gz"]
          if not all(path.is_file() for path in files):
              raise SystemExit(f"Missing wheel or sdist for {package} {version}")
          destination = Path("package-dist")
          destination.mkdir()
          for path in files:
              shutil.copy2(path, destination / path.name)
          PYTHON

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33  # v1.14.2
        with:
          packages-dir: package-dist/
          skip-existing: true
          attestations: true

  verify-public:
    name: Verify production PyPI installations
    runs-on: ubuntu-latest
    needs: [resolve-release, publish]
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          ref: ${{ needs.resolve-release.outputs.commit }}
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6
        with:
          python-version: "3.12"
      - name: Install and exercise the exact public release
        env:
          PYTHON_BIN: python
          TMPDIR: ${{ runner.temp }}
          RELEASE_VERSION: ${{ needs.resolve-release.outputs.version }}
        run: bash scripts/verify_pypi_release.sh "$RELEASE_VERSION"
      - name: Retain public metadata and installation evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: public-pypi-acceptance
          path: |
            ${{ runner.temp }}/sqlseed-pypi-acceptance.*/verification.log
            ${{ runner.temp }}/sqlseed-pypi-acceptance.*/*-install.json
            ${{ runner.temp }}/sqlseed-pypi-acceptance.*/metadata/
          if-no-files-found: error
