name: CI

on:
  push:
    branches: [main, 'feat/**', 'refactor/**', 'fix/**']
  pull_request:
    branches: [main, 'feat/**', 'refactor/**', 'fix/**']

# Least-privilege: no job in this workflow needs write access.
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  PIP_NO_WARN_SCRIPT_LOCATION: "0"
  PYTHONUNBUFFERED: "1"

jobs:
  # ── Fast gate: lint + type check + layer contracts (~45s) ────
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          fetch-depth: 0

      - uses: ./.github/actions/setup-env
        with:
          python-version: "3.12"

      - name: Lint
        run: ruff check src/ tests/ plugins/

      - name: Format check
        run: ruff format --check src/ tests/ plugins/

      - name: Type check
        run: mypy

      - name: Architectural layer contracts (import-linter)
        run: lint-imports

  # ── Core tests: Linux × {3.10, 3.12, 3.13} ─────────────────
  test:
    needs: lint
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          fetch-depth: 0

      - uses: ./.github/actions/setup-env
        with:
          python-version: ${{ matrix.python-version }}

      - name: Test with coverage
        run: >-
          pytest
          --cov=sqlseed --cov=sqlseed_ai --cov=sqlseed_cli --cov=mcp_server_sqlseed
          --cov-report=xml --cov-report=term-missing
          --tb=short -q

      - name: Upload coverage (3.12 only)
        if: matrix.python-version == '3.12'
        uses: codecov/codecov-action@75cd11691c0faa626561e295848008c8a7dddffe  # v5.5.4
        with:
          files: coverage.xml
          fail_ci_if_error: false

  # ── Platform compat: macOS + Windows on 3.12 ────────────────
  test-compat:
    needs: lint
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]

    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          fetch-depth: 0

      - uses: ./.github/actions/setup-env
        with:
          python-version: "3.12"

      - name: Test
        run: pytest --tb=short -q

  # ── Integration tests: PostgreSQL 16 (real DB) ──────────────
  integration:
    needs: lint
    runs-on: ubuntu-latest
    timeout-minutes: 20

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: testdb
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d testdb"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    env:
      PG_TEST_URL: postgresql+psycopg://postgres:postgres@localhost:5432/testdb

    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          fetch-depth: 0

      - uses: ./.github/actions/setup-env
        with:
          python-version: "3.12"

      - name: Run PostgreSQL integration tests
        run: pytest tests/integration/ -v --tb=short

  # ── Property-based tests: contract matrix completeness ──────
  # Runs Hypothesis-based property tests separately because they are
  # slower than unit tests and should not block regular PRs. Catches
  # gaps in the contract matrix before they hit production (Section 12).
  property-tests:
    needs: lint
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          fetch-depth: 0

      - uses: ./.github/actions/setup-env
        with:
          python-version: "3.12"

      - name: Run property-based tests
        run: pytest plugins/sqlseed-ai/tests/property/ -v --maxfail=1 --tb=short
