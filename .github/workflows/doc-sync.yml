name: doc-sync

on:
  pull_request:
    branches: [main, 'feat/**', 'refactor/**', 'fix/**']
  push:
    branches: [main, 'feat/**', 'refactor/**', 'fix/**']

jobs:
  doc-sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install Python dependencies
        # Install local plugins BEFORE core extras so pip can satisfy
        # `sqlseed-cli>=0.1.0` (referenced in [dev] extra) from the
        # local editable install instead of PyPI. sqlseed-cli is not
        # yet published to PyPI (monorepo package).
        run: |
          pip install -e "./plugins/sqlseed-cli"
          pip install -e ".[dev]"

      - name: Run doc_sync tests
        run: python -m pytest tests/test_doc_sync.py -v

      - name: Check AUTO-GENERATED markers
        run: python scripts/sync_docs.py --check
