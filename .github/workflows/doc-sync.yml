name: doc-sync

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  doc-sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install Python dependencies
        run: |
          pip install -e ".[dev]"

      - name: Run doc_sync tests
        run: python -m pytest tests/test_doc_sync.py -v

      - name: Check AUTO-GENERATED markers
        run: python scripts/sync_docs.py --check
