name: doc-sync

on:
  pull_request:
    branches: [main, 'feat/**', 'refactor/**', 'fix/**']
  push:
    branches: [main, 'feat/**', 'refactor/**', 'fix/**']

permissions:
  contents: read

jobs:
  doc-sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6
        with:
          python-version: "3.13"

      - uses: ./.github/actions/install-ci-deps

      - name: Install Python dependencies
        # Supply both local candidates so an unpublished Core requirement
        # is resolved from this checkout rather than the package index.
        run: |
          python -m pip install --no-deps --no-build-isolation -e ".[dev]" -e "./plugins/sqlseed-cli"
          python -m pip check

      - name: Run doc_sync tests
        run: python -m pytest tests/test_doc_sync.py -v

      - name: Check AUTO-GENERATED markers
        run: python scripts/sync_docs.py --check
