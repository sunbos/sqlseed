name: Install locked CI dependencies
description: Verify third-party hashes and use locked tools for source-only dependencies
runs:
  using: composite
  steps:
    - name: Install locked build tools
      shell: bash
      run: |
        python -m pip install --require-hashes --only-binary :all: -r .github/requirements-bootstrap.txt
    - name: Install locked CI dependencies
      # mutmut 2.x and glob2 publish only source archives. Their reviewed hashes
      # are locked; build them with the tools above and no isolated downloads.
      shell: bash
      run: |
        source_packages=glob2,mutmut
        # cryptography >=49 has no Intel macOS wheels. Build the same locked
        # release, with locked Python build tools and the runner's native tools.
        # Keep the exception limited to this architecture and this package.
        if python -c 'import platform, sys; sys.exit(not (sys.platform == "darwin" and platform.machine() == "x86_64"))'; then
          command -v cargo
          command -v clang
          export OPENSSL_DIR="$(brew --prefix openssl@3)"
          python -m pip install --require-hashes --only-binary :all: -r .github/requirements-macos-build.txt
          source_packages=glob2,mutmut,cryptography
        fi
        python -m pip install --require-hashes --only-binary :all: --no-binary "$source_packages" --no-build-isolation --use-pep517 -r .github/requirements-ci.txt
