name: 'Setup sqlseed CI environment'
description: 'Checkout + Python setup (pip cache) + editable install of core & all plugins'

# Shared by every job in ci.yml so the install block lives in ONE place.
# GitHub Actions does not support YAML anchors; a composite action is the
# canonical way to de-duplicate this across jobs.
inputs:
  python-version:
    description: 'Python version for actions/setup-python'
    required: true

runs:
  using: 'composite'
  steps:
    - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
      with:
        fetch-depth: 0

    - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6
      with:
        python-version: ${{ inputs.python-version }}
        cache: 'pip'
        cache-dependency-path: |
          pyproject.toml
          plugins/*/pyproject.toml

    - name: Install dependencies
      # Install local plugins BEFORE core extras so pip can satisfy
      # `sqlseed-cli>=0.1.0` (referenced in [dev] and [all] extras)
      # from the local editable install instead of PyPI. sqlseed-cli
      # is not yet published to PyPI (monorepo package).
      shell: bash
      run: |
        pip install -e "./plugins/sqlseed-cli"
        pip install -e ".[all,dev]"
        pip install -e "./plugins/sqlseed-ai[dev]"
        pip install -e "./plugins/mcp-server-sqlseed"
